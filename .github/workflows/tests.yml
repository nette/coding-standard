# dresscode/dresscode is not on Packagist yet, so `composer install` only works with a local
# path repository; runs are started manually until the package is published, then this
# switches to `on: [push, pull_request]`.
name: Tests

on: workflow_dispatch

jobs:
    tests:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                php: ['8.5']

            fail-fast: false

        name: PHP ${{ matrix.php }} tests
        steps:
            - uses: actions/checkout@v6
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none

            - run: composer install --no-progress --prefer-dist
            - run: composer tester
            - if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: output-${{ matrix.php }}
                  path: tests/**/output
